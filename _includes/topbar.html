<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="{{ site.url }}">{{ site.title }}</a>

    <nav class="topbar-nav" id="topbar-nav" aria-label="Primary">
      <a class="topbar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ site.url }}">Home</a>
      <a class="topbar-nav-item{% if page.url == '/notes/' %} active{% endif %}" href="/notes/">Notes</a>
      <a class="topbar-nav-item{% if page.url == '/2022/09/24/thinking-about-thinking/' %} active{% endif %}" href="/2022/09/24/thinking-about-thinking/">Metacognition</a>
      <a class="topbar-nav-item{% if page.url == '/about/' %} active{% endif %}" href="/about/">About</a>
    </nav>

    <div class="topbar-actions">
      <button type="button" class="color-toggle" id="color-toggle" aria-label="Toggle color mode" title="Toggle light/dark">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
        </svg>
      </button>

      <button type="button" class="topbar-menu-btn" id="topbar-menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="topbar-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<script>
(function () {
  var btn = document.getElementById('topbar-menu-btn');
  var nav = document.getElementById('topbar-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      document.body.classList.remove('nav-open');
      btn.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
